name: "Jobs Scraper Tests"

# 페이지 생성(generate_job_html)이 쓰는 job_scraper 의 정규화·필터 로직이 깨진 것을 바꾼 시점에 알기 위한 것이다.
# 네트워크를 타지 않는 테스트만 돌린다. 자동 수집은 없앴다.
# main 에 직접 푸시하는 경우가 많아서 PR 과 main 푸시 양쪽에 건다.
on:
  pull_request:
    paths:
      - 'tools/*.py'
      - 'tools/jobs_page.html'
      - '.github/workflows/jobs-test.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/*.py'
      - 'tools/jobs_page.html'
      - '.github/workflows/jobs-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Run tests
        run: python tools/test_job_scraper.py
