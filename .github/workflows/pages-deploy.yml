name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  workflow_dispatch:

  # 채용 digest 는 GITHUB_TOKEN 으로 푸시하는데, GitHub 는 워크플로 연쇄를 막으려고
  # 그 푸시로 위의 push 트리거를 깨우지 않는다. 그래서 digest 가 끝나면 여기서
  # 이어받아 배포한다. 이때 체크아웃되는 것은 digest 가 푸시한 뒤의 최신 main 이다.
  # 실패로 끝나도 배포한다. 일부 소스만 실패하면(exit 2) 데이터는 이미 커밋돼 있고,
  # 커밋이 없었다면 같은 내용을 다시 올릴 뿐이다.
  workflow_run:
    workflows: ["Weekly Jobs Digest"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site"
        env:
          JEKYLL_ENV: "production"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
