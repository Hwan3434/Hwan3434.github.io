# 임시 판정용. 원티드 403 이 헤더 문제인지 러너 IP 차단인지 가리기만 한다.
# 판정이 끝나면 이 파일은 지운다. jobs-digest 는 건드리지 않고, 아무것도
# 커밋하지 않는다 (contents: read).
name: "Wanted 403 판정 (임시)"

on:
  push:
    branches:
      - claude/github-action-failure-3yiqrx
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 헤더 A/B 판정
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          import job_scraper as js


          def probe(label, headers):
              try:
                  data = js.fetch_json(js.WANTED_URL, headers)
              except js.SourceError as e:
                  print(f"  {label}: 실패 — {e}")
                  return None
              count = len(data.get('data') or [])
              print(f"  {label}: 성공 — 응답 {count}건")
              return count


          print("=== A: 기존 봇 UA — 실패를 먼저 재현한다 ===")
          old = probe("기존 UA", None)

          print()
          print("=== B: 브라우저 헤더 — 수정안 ===")
          new = probe("브라우저 헤더", js.WANTED_HEADERS)

          print()
          if new is None:
              print("판정: 헤더로는 해결되지 않는다. 러너 IP 차단으로 봐야 한다.")
              print("      → 헤더 수정은 되돌리고 소스 확충(그리팅·Greenhouse·Lever)으로 간다.")
              sys.exit(1)

          if old is not None:
              print("판정: 기존 UA 도 통했다. 403 이 상시 차단이 아니라 간헐적이라는 뜻이다.")
              print("      → 헤더 보강은 그대로 두고, 재시도가 실제 방어선이 된다.")
          else:
              print("판정: 헤더 문제였다. 기존 UA 는 막히고 브라우저 헤더는 통한다.")

          jobs = js.scrape_wanted()
          print(f"모바일 필터 통과 {len(jobs)}건")
          for job in jobs[:10]:
              print(f"  - {job['company']} | {job['title']} ({job['track']})")
          PY
