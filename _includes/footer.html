<footer class="foot">
  <div class="foot-inner">
    {% assign current_lang = page.lang | default: "ko" %}
    {% assign t = site.data[current_lang].footer %}
    <p class="foot-brand">
      <span class="foot-word">Hwan</span>
      <span class="foot-fine">{{ t.slogan }}</span>
    </p>
    <div class="foot-social">
      <a class="icon-btn" href="{{ '/jobs.html' | relative_url }}" aria-label="{{ t.resume }}">
        {% include icon.html name="briefcase" %}
      </a>
      <a class="icon-btn" href="https://github.com/hwan3434" target="_blank" rel="noopener" aria-label="GitHub">
        {% include icon.html name="github" %}
      </a>
      <a class="icon-btn" href="{{ '/feed.xml' | relative_url }}" aria-label="RSS">
        {% include icon.html name="rss" %}
      </a>
    </div>
    <p class="foot-fine">© {{ site.time | date: '%Y' }} Hwan. All rights reserved.</p>
  </div>
</footer>
