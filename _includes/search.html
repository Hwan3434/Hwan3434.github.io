{% assign current_lang = page.lang | default: "ko" %}
{% assign t_search = site.data[current_lang].search %}
<div class="search-scrim" id="search-scrim">
  <div class="search-box" role="dialog" aria-modal="true" aria-label="{{ t_search.label }}">
    <div class="search-field">
      {% include icon.html name="search" %}
      <input type="text" id="search-input" placeholder="{{ t_search.placeholder }}" aria-label="{{ t_search.label }}" autocomplete="off" />
      <kbd class="search-kbd">ESC</kbd>
      <button type="button" class="icon-btn search-close" id="search-close" aria-label="{{ t_search.close }}">
        {% include icon.html name="x" %}
      </button>
    </div>
    <div class="search-results" id="search-results" data-empty="{{ t_search.empty }}"></div>
  </div>
</div>
